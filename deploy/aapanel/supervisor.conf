; aaPanel Supervisor entries for SMS WhiteInfo BD
; Upload to /etc/supervisor/conf.d/ and run: supervisorctl reread && supervisorctl update
; Alternative to systemd units — use ONE OR THE OTHER, not both.

[program:sms-customer-api]
command=/var/www/sms-panel/customer-api/customer-api
directory=/var/www/sms-panel/customer-api
user=www-data
autostart=true
autorestart=true
startretries=5
startsecs=3
stopwaitsecs=35
stopsignal=TERM
environment=HOME="/var/www",USER="www-data"
stdout_logfile=/var/log/sms-panel/customer-api.log
stderr_logfile=/var/log/sms-panel/customer-api.error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

[program:sms-superman-api]
command=/var/www/sms-panel/superman-api/superman-api
directory=/var/www/sms-panel/superman-api
user=www-data
autostart=true
autorestart=true
startretries=5
startsecs=3
stopwaitsecs=15
stopsignal=TERM
environment=HOME="/var/www",USER="www-data"
stdout_logfile=/var/log/sms-panel/superman-api.log
stderr_logfile=/var/log/sms-panel/superman-api.error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

[program:sms-sp-api]
command=/var/www/sms-panel/sp-api/sp-api
directory=/var/www/sms-panel/sp-api
user=www-data
autostart=true
autorestart=true
startretries=5
startsecs=3
stopwaitsecs=15
stopsignal=TERM
environment=HOME="/var/www",USER="www-data"
stdout_logfile=/var/log/sms-panel/sp-api.log
stderr_logfile=/var/log/sms-panel/sp-api.error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

[group:sms-panel]
programs=sms-customer-api,sms-superman-api,sms-sp-api
