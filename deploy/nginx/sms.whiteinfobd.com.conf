# nginx configuration for sms.whiteinfobd.com
# New server: nginx + MariaDB + 3 Go binaries + static SvelteKit frontend
# No PHP, no Redis, no Laravel.
#
# Install: copy to /etc/nginx/sites-available/sms.whiteinfobd.com
#          ln -s /etc/nginx/sites-available/sms.whiteinfobd.com /etc/nginx/sites-enabled/
#          nginx -t && systemctl reload nginx

upstream customer_api {
    server 127.0.0.1:8082;
    keepalive 32;
}

upstream superman_api {
    server 127.0.0.1:8081;
    keepalive 32;
}

upstream sp_api {
    server 127.0.0.1:8083;
    keepalive 32;
}

server {
    listen 80;
    server_name sms.whiteinfobd.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sms.whiteinfobd.com;

    ssl_certificate     /etc/letsencrypt/live/sms.whiteinfobd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sms.whiteinfobd.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /var/www/sms-panel/frontend/build;
    index index.html;

    # ── Security headers ───────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Proxy IP headers: OVERWRITE both headers with the real socket peer ─────
    # This prevents header spoofing. Go services use X-Real-IP only when peer is loopback.
    proxy_set_header X-Real-IP        $remote_addr;
    proxy_set_header X-Forwarded-For  $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host             $host;
    proxy_http_version 1.1;
    proxy_set_header Connection       "";

    # ── KYC / private file streaming ──────────────────────────────────────────
    # ^~ prevents regex location rules from intercepting /kyc-files/*.jpg etc.
    location ^~ /kyc-files/ {
        proxy_pass http://customer_api;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
        proxy_buffering off;
        client_max_body_size 50m;
    }

    location ^~ /downloads/ {
        proxy_pass http://customer_api;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location ^~ /phone-photo/ {
        proxy_pass http://customer_api;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 20m;
    }

    # ── Webhooks (payment + SMS DLR) ──────────────────────────────────────────
    location ^~ /webhooks/ {
        proxy_pass http://customer_api;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }

    location ^~ /payments/ {
        proxy_pass http://customer_api;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # ── Customer Portal API (/api/v1/customer/* and developer /api/v1/*) ───────
    location ^~ /api/v1/customer/ {
        proxy_pass http://customer_api;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    # Developer API (also customer-api)
    location ^~ /api/v1/ {
        proxy_pass http://customer_api;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
        client_max_body_size 5m;
    }

    # ── Superman (Admin) API ──────────────────────────────────────────────────
    location ^~ /api/v1/superman/ {
        proxy_pass http://superman_api;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        client_max_body_size 50m;
    }

    # ── SP (Reseller) API ─────────────────────────────────────────────────────
    location ^~ /api/v1/sp/ {
        proxy_pass http://sp_api;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    # ── Health checks ─────────────────────────────────────────────────────────
    location ^~ /health {
        proxy_pass http://customer_api;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        access_log off;
    }

    # ── SvelteKit static files (assets have content hashes, long-lived cache) ─
    location ^~ /assets/ {
        root /var/www/sms-panel/frontend/build;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ^~ /favicon.ico {
        root /var/www/sms-panel/frontend/build;
        expires 7d;
        access_log off;
    }

    # ── SvelteKit SPA fallback (all remaining routes → index.html) ────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # ── Limits ───────────────────────────────────────────────────────────────
    client_max_body_size 50m;
    keepalive_timeout 65;
}
